<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D 赛车原型 - Drift + Wheel Steering + Lap Timer</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(15, 23, 42, 0.75);
      --text: #e5e7eb;
      --accent: #67e8f9;
      --road: #374151;
      --grass: #1f7a3f;
      --lane: #f8fafc;
      --car: #f97316;
      --car2: #60a5fa;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: min(92vw, 960px);
      height: auto;
      border: 2px solid rgba(255,255,255,0.08);
      background: #0f172a;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const keys = {};
    const pressed = (k) => !!keys[k];

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === ' ') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    const track = {
      cx: canvas.width / 2,
      cy: canvas.height / 2,
      inner: 150,
      outer: 220,
      startAngle: -Math.PI / 2
    };

    const car = {
      x: track.cx + 185,
      y: track.cy,
      angle: 0, // 车身方向
      wheelAngle: 0, // 前轮转向角
      vx: 0,
      vy: 0,
      maxSpeed: 360,
      accel: 280,
      brake: 360,
      grip: 0.94,               // 正常抓地力
      handbrakeGrip: 0.62,      // 刹车/漂移时抓地力
      drag: 0.992,
      radius: 18
    };

    const lapState = {
      totalTime: 0,
      lapTime: 0,
      lapCount: 1,
      bestLap: Infinity,
      lastProgress: getProgress(car.x, car.y),
      startLineCrossed: false
    };

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function dot(ax, ay, bx, by) {
      return ax * bx + ay * by;
    }

    function normalizeAngle(a) {
      while (a < -Math.PI) a += Math.PI * 2;
      while (a > Math.PI) a -= Math.PI * 2;
      return a;
    }

    function getProgress(x, y) {
      const dx = x - track.cx;
      const dy = y - track.cy;
      const a = Math.atan2(dy, dx);
      const base = (a - track.startAngle + Math.PI * 2) % (Math.PI * 2);
      return base / (Math.PI * 2);
    }

    function updateCar(dt) {
      const up = pressed('w') || pressed('arrowup');
      const down = pressed('s') || pressed('arrowdown');
      const left = pressed('a') || pressed('arrowleft');
      const right = pressed('d') || pressed('arrowright');
      const handbrake = pressed('shift');

      const speed = Math.hypot(car.vx, car.vy);
      const forwardX = Math.cos(car.angle);
      const forwardY = Math.sin(car.angle);
      const rightX = Math.cos(car.angle + Math.PI / 2);
      const rightY = Math.sin(car.angle + Math.PI / 2);

      // 1) 前轮转向角
      const steerInput = (right ? 1 : 0) - (left ? 1 : 0);
      const targetWheelAngle = steerInput * 0.7;
      car.wheelAngle = lerp(car.wheelAngle, targetWheelAngle, 0.18);

      // 2) 车身方向根据速度/转向更新
      const turnForce = (0.7 + speed / car.maxSpeed) * 1.8;
      car.angle += car.wheelAngle * turnForce * dt * 60;

      // 3) 加速 / 刹车
      const throttle = (up ? 1 : 0) - (down ? 1 : 0);

      // 控制方向向量的推进
      if (throttle > 0) {
        car.vx += forwardX * car.accel * dt;
        car.vy += forwardY * car.accel * dt;
      } else if (throttle < 0) {
        car.vx -= forwardX * car.brake * dt * 0.5;
        car.vy -= forwardY * car.brake * dt * 0.5;
      }

      // 4) 减速度：自然滚动阻力
      const currentSpeed = Math.hypot(car.vx, car.vy);
      if (currentSpeed > 0) {
        const drag = handbrake ? 0.985 : 0.992;
        car.vx *= drag;
        car.vy *= drag;
      }

      // 5) 悬挂/抓地：车身侧向滑移（漂移核心）
      const grip = handbrake ? car.handbrakeGrip : car.grip;
      const lateralSpeed = dot(car.vx, car.vy, rightX, rightY);
      car.vx -= rightX * lateralSpeed * (1 - grip) * dt * 60;
      car.vy -= rightY * lateralSpeed * (1 - grip) * dt * 60;

      // 6) 最大速度限制
      const limitedSpeed = Math.hypot(car.vx, car.vy);
      if (limitedSpeed > car.maxSpeed) {
        const ratio = car.maxSpeed / limitedSpeed;
        car.vx *= ratio;
        car.vy *= ratio;
      }

      // 7) 位移
      car.x += car.vx * dt;
      car.y += car.vy * dt;

      // 8) 赛道边界碰撞 + 反弹
      const dist = Math.hypot(car.x - track.cx, car.y - track.cy);
      if (dist < track.inner || dist > track.outer) {
        const nx = (car.x - track.cx) / Math.max(dist, 1);
        const ny = (car.y - track.cy) / Math.max(dist, 1);

        const desiredDist = dist < track.inner ? track.inner : track.outer;
        car.x = track.cx + nx * desiredDist;
        car.y = track.cy + ny * desiredDist;

        const normalSpeed = car.vx * nx + car.vy * ny;
        car.vx -= 2 * normalSpeed * nx;
        car.vy -= 2 * normalSpeed * ny;

        car.vx *= 0.74;
        car.vy *= 0.74;
      }

      // 9) lap 计时
      const progress = getProgress(car.x, car.y);
      const speedThreshold = Math.hypot(car.vx, car.vy) > 30;

      // 过起点线：从 0.8 -> 0.1
      if (lapState.lastProgress > 0.8 && progress < 0.18 && speedThreshold) {
        if (!lapState.startLineCrossed) {
          lapState.startLineCrossed = true;
          lapState.lapCount += 1;
          lapState.bestLap = Math.min(lapState.bestLap, lapState.lapTime);
          lapState.lapTime = 0;
        }
      } else if (progress > 0.2) {
        lapState.startLineCrossed = false;
      }

      lapState.lastProgress = progress;
      lapState.totalTime += dt;
      lapState.lapTime += dt;
    }

    function drawBackground() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 赛道草地
      ctx.beginPath();
      ctx.arc(track.cx, track.cy, track.outer + 40, 0, Math.PI * 2);
      ctx.fillStyle = '#1f7a3f';
      ctx.fill();

      // 路面
      ctx.beginPath();
      ctx.arc(track.cx, track.cy, track.outer, 0, Math.PI * 2);
      ctx.fillStyle = '#374151';
      ctx.fill();

      // 路内空白
      ctx.beginPath();
      ctx.arc(track.cx, track.cy, track.inner, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // 路线中间线
      ctx.beginPath();
      ctx.arc(track.cx, track.cy, (track.inner + track.outer) / 2, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.setLineDash([16, 12]);
      ctx.strokeStyle = '#f8fafc';
      ctx.stroke();
      ctx.setLineDash([]);

      // 起点线
      const sx = track.cx + Math.cos(track.startAngle) * track.outer;
      const sy = track.cy + Math.sin(track.startAngle) * track.outer;
      const ex = track.cx + Math.cos(track.startAngle) * (track.outer + 28);
      const ey = track.cy + Math.sin(track.startAngle) * (track.outer + 28);

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 5;
      ctx.stroke();
    }

    function drawWheel(x, y, angle, radius = 5) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.fillStyle = '#111827';
      ctx.fillRect(-radius, -radius * 0.7, radius * 2, radius * 1.4);

      ctx.restore();
    }

    function drawCar() {
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // 车体
      ctx.fillStyle = '#f97316';
      ctx.fillRect(-18, -10, 36, 20);

      // 车头
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(13, -4, 10, 8);

      // 后视镜/细节
      ctx.fillStyle = '#111827';
      ctx.fillRect(-16, -12, 8, 3);
      ctx.fillRect(-16, 9, 8, 3);

      // 前轮
      drawWheel(-10, -12, car.wheelAngle, 5);
      drawWheel(-10, 12, car.wheelAngle, 5);

      // 后轮
      drawWheel(10, -12, 0, 5);
      drawWheel(10, 12, 0, 5);

      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(18, 18, 280, 110);

      ctx.fillStyle = '#e5e7eb';
      ctx.font = '20px sans-serif';
      ctx.fillText('Lap: ' + Math.max(1, lapState.lapCount - 1), 32, 48);
      ctx.fillText('Current: ' + lapState.lapTime.toFixed(1) + 's', 32, 76);
      ctx.fillText('Best: ' + (lapState.bestLap === Infinity ? '--' : lapState.bestLap.toFixed(1) + 's'), 32, 104);
      ctx.fillText('Speed: ' + Math.round(Math.hypot(car.vx, car.vy)) + ' km/h', 32, 132);
    }

    let lastTime = 0;
    function loop(ts) {
      const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.033);
      lastTime = ts;

      updateCar(dt);

      drawBackground();
      drawCar();
      drawHud();

      requestAnimationFrame(loop);
    }

    // 初始位置
    car.x = track.cx + 185;
    car.y = track.cy;
    car.angle = 0;
    lapState.lastProgress = getProgress(car.x, car.y);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
